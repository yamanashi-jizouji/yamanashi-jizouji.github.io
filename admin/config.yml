backend:
  name: turbo-github
  turbo_site_id: 2a1ee6ce-86d3-4804-a96d-dc79eac00b9c
  branch: main
  deploy_status: false

locale: ja
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_content"
    label: "地蔵寺ホームページ"
    files:
      - name: "updates"
        label: "お知らせ・ギャラリー"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "お知らせ"
            name: "notices"
            widget: "list"
            summary: "{{fields.date}}｜{{fields.title}}"
            fields:
              - { label: "日付", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "本文", name: "body", widget: "text" }
          - label: "ギャラリー"
            name: "gallery"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "写真", name: "image", widget: "image" }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "説明", name: "description", widget: "text", required: false }
